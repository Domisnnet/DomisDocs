<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar PRO_KEY - DomisPacks</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060606;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,136,0.05) 1px, transparent 1px),linear-gradient(90deg, rgba(0,255,136,0.05) 1px, transparent 1px);background-size:48px 48px}
.card{position:relative;z-index:1;width:100%;max-width:480px;background:linear-gradient(180deg,#141414,#0a0a0a);border:1px solid #1e1e1e;border-radius:24px;padding:32px;box-shadow:0 0 80px rgba(0,0,0,0.8)}
h1{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:8px}
h1 span{color:#00ff88}
.sub{color:#666;font-size:13px;margin-bottom:24px;line-height:1.5}
input{width:100%;background:#0a0a0a;border:2px solid #1e1e1e;border-radius:12px;padding:16px;font-family:'JetBrains Mono';font-size:16px;color:#fff;letter-spacing:1px;text-transform:uppercase;outline:none;transition:.2s}
input:focus{border-color:#00ff88;box-shadow:0 0 20px rgba(0,255,136,0.2)}
input.valid{border-color:#00ff88;box-shadow:0 0 30px rgba(0,255,136,0.5), inset 0 0 20px rgba(0,255,136,0.1);color:#00ff88}
input.invalid{border-color:#ff4444;box-shadow:0 0 30px rgba(255,68,68,0.3);color:#ff4444}
.btn{width:100%;margin-top:16px;background:#00ff88;color:#000;border:none;padding:16px;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 40px rgba(0,255,136,0.6)}
.btn:disabled{background:#222;color:#555;box-shadow:none;cursor:not-allowed}
.status{margin-top:16px;padding:12px;border-radius:10px;font-family:'JetBrains Mono';font-size:12px;display:none}
.status.ok{display:block;background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);color:#00ff88}
.status.err{display:block;background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.3);color:#ff8888}
code{background:#0a0a0a;padding:2px 6px;border-radius:4px;border:1px solid #1e1e1e}
</style>
</head>
<body>
<div class="grid"></div>
<div class="card">
<h1>Verificar <span>PRO_KEY</span></h1>
<p class="sub">Digite sua PRO_KEY <code>DOMIS-XXXX-XXXX-XXXX</code> recebida por email após a compra na Kiwify. Teste com <code>DOMIS-BD89-184E-82CD</code></p>
<input id="keyInput" placeholder="DOMIS-XXXX-XXXX-XXXX" maxlength="19">
<button id="btnVerify" class="btn">VERIFICAR AGORA →</button>
<div id="status" class="status"></div>
<p style="margin-top:20px;text-align:center"><a href="/" style="color:#555;font-family:'JetBrains Mono';font-size:11px;text-decoration:none">← Voltar ao inicio</a> • <a href="https://us-central1-domisdocs-602fc.cloudfunctions.net/ping" style="color:#555;font-size:11px;text-decoration:none">API Online</a></p>
</div>
<script>
const input = document.getElementById('keyInput');
const btn = document.getElementById('btnVerify');
const status = document.getElementById('status');
const API = 'https://us-central1-domisdocs-602fc.cloudfunctions.net/verifyProKey';

function formatKey(v){
  v=v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16);
  if(v.startsWith('DOMIS')) v=v.slice(5);
  let out='DOMIS';
  if(v.length>0) out+='-'+v.slice(0,4);
  if(v.length>4) out+='-'+v.slice(4,8);
  if(v.length>8) out+='-'+v.slice(8,12);
  return out;
}
input.addEventListener('input', e=>{ e.target.value=formatKey(e.target.value); e.target.className=''; status.className='status'; });

async function verificar(){
  const key = input.value.trim().toUpperCase();
  if(key.length<14){ status.textContent='Digite a PRO_KEY completa'; status.className='status err'; return; }
  btn.disabled=true; btn.textContent='VERIFICANDO...'; status.textContent='Consultando Firestore...'; status.className='status ok';
  try{
    const r = await fetch(`${API}?key=${encodeURIComponent(key)}`);
    const data = await r.json();
    if(data.valid){
      input.className='valid';
      status.innerHTML=`✅ <b>PRO_KEY VÁLIDA!</b><br>Email: ${data.email}<br>Agora rode: <code>npx create-domis@latest</code><br><small>e digite sua key quando pedir</small>`;
      status.className='status ok';
      btn.textContent='✓ LIBERADO!';
    } else {
      input.className='invalid';
      status.textContent=`❌ PRO_KEY inválida ou não encontrada: ${data.reason||''}`;
      status.className='status err';
      btn.textContent='TENTAR NOVAMENTE';
    }
  }catch(err){
    status.textContent='Erro de conexão: '+err.message;
    status.className='status err';
    btn.textContent='TENTAR NOVAMENTE';
  }
  btn.disabled=false;
}
btn.addEventListener('click', verificar);
input.addEventListener('keydown', e=>{ if(e.key==='Enter') verificar(); });
</script>
</body>
</html>
